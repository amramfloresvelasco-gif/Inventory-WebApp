name: Deploy Inventory Web App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-webapp-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CLASP
        run: npm install -g @google/clasp@3.4.1
      - name: Run regression tests
        run: |
          node tests/count-workflow.test.js
          node tests/location-comparison.test.js
          node tests/product-index-preview.test.js
          node tests/product-index-import-guard.test.js
          node tests/ws-extended-report.test.js
          node tests/ownership-exclusions.test.js
          node tests/index-ui-syntax.test.js
      - name: Prepare versioned Apps Script source
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.sha }}
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
          SCRIPT_ID: ${{ secrets.INVENTORY_APPS_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.INVENTORY_WEBAPP_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLASP_CREDENTIALS" || { echo "Missing CLASP_CREDENTIALS"; exit 1; }
          test -n "$SCRIPT_ID" || { echo "Missing INVENTORY_APPS_SCRIPT_ID"; exit 1; }
          test -n "$DEPLOYMENT_ID" || { echo "Missing INVENTORY_WEBAPP_DEPLOYMENT_ID"; exit 1; }
          mkdir -p deploy
          cp src/*.gs src/*.html deploy/
          test "$(find deploy -maxdepth 1 \( -name '*.gs' -o -name '*.html' \) | wc -l)" -ge 13
          cp src/appsscript.json deploy/appsscript.json
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          sha=os.environ['DEPLOYED_SHA'][:8]
          built=datetime.now(timezone.utc).isoformat()
          Path('deploy/BuildInfo.gs').write_text(
              '// Generated by Inventory GitHub Actions; not committed.\n'
              'function apiInventoryBuildInfo() {\n'
              f'  return {{commit:"{sha}",builtAt:"{built}"}};\n'
              '}\n', encoding='utf-8')
          PY
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > deploy/.clasp.json
      - name: Push and update existing Web App deployment
        working-directory: deploy
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ secrets.INVENTORY_WEBAPP_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          clasp push --force
          OUTPUT="$(clasp version 'Inventory GitHub Actions deployment')"
          echo "$OUTPUT"
          VERSION="$(printf '%s\n' "$OUTPUT" | sed -n 's/^Created version \([0-9][0-9]*\).*$/\1/p')"
          test -n "$VERSION"
          clasp redeploy "$DEPLOYMENT_ID" --versionNumber "$VERSION" --description "Inventory automated deployment"
