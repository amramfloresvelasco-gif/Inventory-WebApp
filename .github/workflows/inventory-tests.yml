name: Inventory backend tests

on:
  push:
    branches: [main]
    paths:
      - 'src/Code.gs'
      - 'src/Index.html'
      - 'src/ProductIndexPreview.gs'
      - 'src/ProductIndexLivePreview.gs'
      - 'src/ProductIndexImportGuard.gs'
      - 'src/WSSnapshots.gs'
      - 'src/OwnershipExclusions.gs'
      - 'src/LocationComparison.gs'
      - 'src/LocationComparisonTests.gs'
      - 'src/LocationComparisonFixtureTests.gs'
      - 'src/PalletChildPlanner.gs'
      - 'tests/**'
      - '.github/workflows/inventory-tests.yml'
  pull_request:
    paths:
      - 'src/Code.gs'
      - 'src/Index.html'
      - 'src/ProductIndexPreview.gs'
      - 'src/ProductIndexLivePreview.gs'
      - 'src/ProductIndexImportGuard.gs'
      - 'src/WSSnapshots.gs'
      - 'src/OwnershipExclusions.gs'
      - 'src/LocationComparison.gs'
      - 'src/LocationComparisonTests.gs'
      - 'src/LocationComparisonFixtureTests.gs'
      - 'tests/**'
      - '.github/workflows/inventory-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pallet child expansion and parent traceability
        run: node tests/pallet-child-planner.test.js
      - name: Counting, EMPTY and deletion workflow
        run: node tests/count-workflow.test.js
      - name: Location comparison rules and fixtures
        run: node tests/location-comparison.test.js
      - name: ProductIndex preview mapping
        run: node tests/product-index-preview.test.js
      - name: ProductIndex initial import safety guards
        run: node tests/product-index-import-guard.test.js
      - name: Extended legacy report ownership and quantity
        run: node tests/ws-extended-report.test.js
      - name: Ownership exclusion configuration
        run: node tests/ownership-exclusions.test.js
      - name: Admin UI syntax and CSV export safety
        run: node tests/index-ui-syntax.test.js
