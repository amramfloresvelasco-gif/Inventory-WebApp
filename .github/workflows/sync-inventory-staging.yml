name: Sync Inventory Staging Tests

# Staging-only synchronization. Never uses production deployment secrets.
# Also supports manual dispatch for recovery or verification.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'staging/PalletAdminInspectionStaging.gs'
      - 'staging/PalletInterruptedSaveStaging.gs'
      - 'staging/PalletPartialFailClosedStaging.gs'
      - 'staging/PalletRecoveryMatrixStaging.gs'
      - 'staging/PalletTeamIsolationStaging.gs'
      - 'staging/StagingWebMap.gs'
      - 'staging/StagingMap.html'
      - '.github/workflows/sync-inventory-staging.yml'

permissions:
  contents: read

concurrency:
  group: inventory-staging-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CLASP
        run: npm install -g @google/clasp@3.4.1
      - name: Validate isolated staging credentials and retrieve remote source
        shell: bash
        env:
          STAGING_CLASP_CREDENTIALS: ${{ secrets.INVENTORY_STAGING_CLASP_CREDENTIALS }}
          STAGING_SCRIPT_ID: ${{ secrets.INVENTORY_STAGING_SCRIPT_ID }}
        run: |
          set -euo pipefail
          expected_script='1M_H1tAwaHvUB-B7q4ahoQ702rF29m7uPx4XjwbHQWdzMCv4pXfdkc2NP'
          expected_db='1EaaGTFahbAdS3QqywFh4yeuXntCjL8ik1kZcQvqq2zo'
          test "$STAGING_SCRIPT_ID" = "$expected_script" || { echo 'BLOCKED: staging Script ID mismatch'; exit 1; }
          test -n "$STAGING_CLASP_CREDENTIALS" || { echo 'BLOCKED: missing staging credentials'; exit 1; }
          mkdir -p staging-sync
          printf '%s' "$STAGING_CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$STAGING_SCRIPT_ID" > staging-sync/.clasp.json
          cd staging-sync
          clasp pull
          test -f appsscript.json || { echo 'BLOCKED: remote staging manifest missing'; exit 1; }
          test -f Code.js || { echo 'BLOCKED: existing staging Code.js missing'; exit 1; }
          grep -Fq "$expected_db" Code.js || { echo 'BLOCKED: staging database not found in Code.js'; exit 1; }
          if grep -R -l -F '12teaGz7z2Ems-Elqz5vHv1Z8S5aV4kJMJrnBxlMYQ5Y' --include='*.gs' --include='*.js' --include='*.html' .; then
            echo 'BLOCKED: production database ID present in staging project'; exit 1
          fi
          echo 'Staging identity and existing remote files verified.'
      - name: Overlay approved staging modules and read-only map without deleting remote-only files
        shell: bash
        run: |
          set -euo pipefail
          # Only add approved staging modules and isolated read-only map; do not replace the remote staging writer,
          # Code.js, appsscript.json, or any production application module.
          for f in staging/PalletAdminInspectionStaging.gs staging/PalletInterruptedSaveStaging.gs staging/PalletPartialFailClosedStaging.gs staging/PalletRecoveryMatrixStaging.gs staging/PalletTeamIsolationStaging.gs staging/StagingWebMap.gs; do
            test -f "$f"
            base="$(basename "$f" .gs)"
            if test -f "staging-sync/$base.js"; then
              # clasp pull often writes server-side .gs files as .js.
              # Keep one local representation per Apps Script filename.
              cp "$f" "staging-sync/$base.js"
              rm -f "staging-sync/$base.gs"
            else
              cp "$f" "staging-sync/$base.gs"
            fi
          done
          # Apps Script HTML files use .html unchanged.
          cp staging/StagingMap.html staging-sync/StagingMap.html
          cd staging-sync
          clasp status
      - name: Push staging test modules and read-only map only
        working-directory: staging-sync
        shell: bash
        env:
          STAGING_SCRIPT_ID: ${{ secrets.INVENTORY_STAGING_SCRIPT_ID }}
        run: |
          set -euo pipefail
          test "$STAGING_SCRIPT_ID" = '1M_H1tAwaHvUB-B7q4ahoQ702rF29m7uPx4XjwbHQWdzMCv4pXfdkc2NP'
          clasp push --force
          echo 'Staging modules and read-only map synchronized; no Web App redeployment.'
