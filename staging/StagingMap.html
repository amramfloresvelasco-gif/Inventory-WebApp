<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:15px Arial,sans-serif;background:#f5f7fb;color:#17243b;margin:0}main{max-width:900px;margin:auto;padding:24px}
h1{font-size:24px}.notice{background:#fff2cf;border:1px solid #c49a2e;padding:12px;border-radius:8px}
button{background:#1755a5;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:18px}
.cell{border:1px solid #aab4c2;border-radius:10px;padding:16px;color:#17243b;text-align:left;cursor:default}
.neutral{background:#eef1f5}.yellow{background:#fff0ac}.red{background:#ffcece}.green{background:#bceac9}
#status{margin:12px 0;white-space:pre-wrap}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.filters button{background:#e5eaf3;color:#17243b;border:1px solid #aab4c2}.filters button[aria-pressed="true"]{background:#1755a5;color:#fff}.filters button:disabled{opacity:.5}.search{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}.search label{font-weight:600}.search input{flex:1;min-width:170px;max-width:400px;padding:10px;border:1px solid #aab4c2;border-radius:8px;font:inherit}.search button{background:#e5eaf3;color:#17243b;border:1px solid #aab4c2}.sort{display:flex;align-items:center;gap:8px;margin-top:12px}.sort select{font:inherit;padding:9px;border:1px solid #aab4c2;border-radius:8px;background:#fff}.sort{flex-wrap:wrap}#sort-test-result{margin-top:8px;font-weight:600}
</style></head><body><main><h1>BMD Inventory — STAGING Map</h1>
<p class="notice"><strong>ISOLATED STAGING — READ ONLY</strong><br>No counting, saving, deleting, or production access is available here.</p>
<p>Session: STAGING-SESSION-001</p><button id="refresh" type="button">Refresh Map</button>
<div id="status" role="status">Loading…</div><div id="filters" class="filters" role="group" aria-label="Filter locations by status"><button type="button" data-color="all" aria-pressed="true">All</button><button type="button" data-color="red" aria-pressed="false">Red</button><button type="button" data-color="yellow" aria-pressed="false">Yellow</button><button type="button" data-color="green" aria-pressed="false">Green</button><button type="button" data-color="neutral" aria-pressed="false">Not started</button></div><div class="search"><label for="location-search">Find location</label><input id="location-search" type="search" placeholder="Location ID, bay, or warehouse" autocomplete="off"><button id="clear-search" type="button">Clear search</button></div><div class="sort"><label for="map-sort">Sort locations</label><select id="map-sort"><option value="priority">Needs attention first</option><option value="location-asc">Location ID (A–Z)</option><option value="location-desc">Location ID (Z–A)</option><option value="bay">Bay (A–Z)</option></select><button id="test-sort" type="button">Test sorting (sample locations)</button></div><div id="sort-test-result" role="status"></div><div id="grid" class="grid"></div>
<script>
let currentCards=[],activeFilter='all',mapReady=false;
const colors=['neutral','yellow','red','green'];
function sortLocationCards(cards,sort){
 const byText=(a,b)=>String(a||'').localeCompare(String(b||''),undefined,{numeric:true,sensitivity:'base'});
 const priority={red:0,yellow:1,neutral:2,green:3};
 return cards.sort((a,b)=>{
  if(sort==='location-desc')return byText(b.locationId,a.locationId);
  if(sort==='location-asc')return byText(a.locationId,b.locationId);
  if(sort==='bay')return byText(a.bay,b.bay)||byText(a.locationId,b.locationId);
  return priority[a.color]-priority[b.color]||byText(a.locationId,b.locationId);
 });
}
function testSortSamples(){
 const samples=[
  {locationId:'LOC-10',bay:'B-10',color:'green'},
  {locationId:'LOC-2',bay:'B-2',color:'red'},
  {locationId:'LOC-4',bay:'B-4',color:'neutral'},
  {locationId:'LOC-3',bay:'B-3',color:'yellow'}
 ];
 const cases=[
  ['priority','LOC-2,LOC-3,LOC-4,LOC-10'],
  ['location-asc','LOC-2,LOC-3,LOC-4,LOC-10'],
  ['location-desc','LOC-10,LOC-4,LOC-3,LOC-2'],
  ['bay','LOC-2,LOC-3,LOC-4,LOC-10']
 ];
 const failures=cases.filter(([mode,expected])=>sortLocationCards(samples.slice(),mode).map(x=>x.locationId).join(',')!==expected);
 document.getElementById('sort-test-result').textContent=failures.length
  ?'SORT TEST FAILED: '+failures.map(x=>x[0]).join(', ')
  :'SORT TEST PASS — 4 sample scenarios; no inventory data changed.';
}
function renderCards(){
 const grid=document.getElementById('grid'),status=document.getElementById('status');
 grid.replaceChildren();
 if(!mapReady)return;
 const counts={neutral:0,yellow:0,red:0,green:0};
 for(const x of currentCards)counts[x.color]++;
 const query=document.getElementById('location-search').value.trim().toLocaleLowerCase();
 const shown=currentCards.filter(x=>(activeFilter==='all'||x.color===activeFilter)&&(!query||[x.locationId,x.bay,x.warehouse].some(v=>String(v||'').toLocaleLowerCase().includes(query))));
 sortLocationCards(shown,document.getElementById('map-sort').value);
 for(const x of shown){
  const c=document.createElement('div');c.className='cell '+x.color;
  c.textContent=x.bay+' · '+x.locationId+' · '+x.color.toUpperCase();
  const d=document.createElement('p');
  d.textContent='Team A: '+x.entryCountA+' entries | Team B: '+x.entryCountB+' entries | Mismatches: '+x.mismatchCount;
  c.appendChild(d);grid.appendChild(c);
 }
 status.textContent='Neutral '+counts.neutral+' · Yellow '+counts.yellow+' · Red '+counts.red+' · Green '+counts.green+' | Showing '+shown.length+' of '+currentCards.length+' locations';
 if(!shown.length){const p=document.createElement('p');p.textContent='No locations match this filter.';grid.appendChild(p);}
}
function refresh(){
 const btn=document.getElementById('refresh'),status=document.getElementById('status'),grid=document.getElementById('grid');
 btn.disabled=true;mapReady=false;currentCards=[];status.textContent='Reading staging counts…';grid.replaceChildren();
 google.script.run.withSuccessHandler(r=>{
  btn.disabled=false;
  if(!r||!r.stagingOnly||!r.readOnly||r.databaseWrites!==0){status.textContent='Blocked: invalid staging response';return;}
  if(!r.integrity||!r.integrity.ok){status.textContent='INTEGRITY WARNING — map withheld. Duplicate locations: '+(r.integrity?.duplicateLocationIds?.length||0)+'; invalid active entries: '+(r.integrity?.invalidEntries?.length||0)+'. Contact administrator.';return;}
  if(!Array.isArray(r.cards)||r.cards.some(x=>!colors.includes(x.color))){status.textContent='Blocked: invalid map cards';return;}
  currentCards=r.cards;mapReady=true;renderCards();
 }).withFailureHandler(e=>{btn.disabled=false;status.textContent='Error: '+(e.message||String(e));}).apiStagingMapReadOnly142();
}
document.getElementById('filters').addEventListener('click',e=>{
 const b=e.target.closest('button[data-color]');
 if(!b)return;
 activeFilter=b.dataset.color;
 for(const x of document.querySelectorAll('#filters button'))x.setAttribute('aria-pressed',String(x===b));
 renderCards();
});
document.getElementById('map-sort').addEventListener('change',renderCards);
document.getElementById('test-sort').addEventListener('click',testSortSamples);
document.getElementById('location-search').addEventListener('input',renderCards);
document.getElementById('clear-search').addEventListener('click',()=>{const input=document.getElementById('location-search');input.value='';renderCards();input.focus();});
document.getElementById('refresh').addEventListener('click',refresh);refresh();
</script></main></body></html>
